---
layout: default
title: 記事一覧
---

<section class="hero is-light" style="background: linear-gradient(135deg, #00b5ee 0%, #0077b5 100%); padding: 3rem 0;">
  <div class="hero-body">
    <div class="container has-text-centered">
      <h1 class="title has-text-white" style="font-weight: 700; letter-spacing: 0.05em;">
        記事一覧
      </h1>
      <p class="subtitle has-text-white-ter is-6 mt-3">
        活動の記録や展示情報を公開しています
      </p>
      <div class="mt-4">
        <a href="/tags/tags" class="button is-white is-outlined is-rounded is-small">
          <i class="fa-solid fa-calendar-days mr-2"></i> 年度別の記事一覧はこちら
        </a>
      </div>
    </div>
  </div>
</section>

<section class="section" style="background-color: #fafafa;">
  <div class="container">
    <div class="columns is-desktop">
      
      <div class="column is-9-desktop">
        <div class="columns is-multiline">
          {% for post in site.posts %}
          <div class="column is-4-desktop is-6-tablet">
            <a href="{{ post.url }}" class="card-blog-b" style="height: 100%; min-height: 280px;">
              <div class="overlay-image">
                {% if post.image %}
                <img src="{{ post.image }}" alt="">
                {% else %}
                <img src="/assets/img/logo.jpg" alt="">
                {% endif %}
              </div>
              <div class="overlay-text">
                <p style="font-size: 0.75rem; opacity: 0.9; margin-bottom: 0.3rem;">
                  <i class="fa-regular fa-clock mr-1"></i> {{ post.date | date: "%Y/%m/%d" }}
                </p>
                <p class="card-title" style="font-size: 1rem; font-weight: bold; line-height: 1.4;">
                  {{ post.title }}
                </p>
              </div>
            </a>
          </div>
          {% endfor %}
        </div>
      </div>
      {% include right_column.html %}
    </div>
  </div>
</section>
